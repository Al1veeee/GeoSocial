ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.geosocial.ApplicationKt.module ]
    }
}

db {
    url = "jdbc:postgresql://localhost:5432/geosocial"
    url = ${?DB_URL}
    user = "geosocial"
    user = ${?DB_USER}
    password = "geosocial"
    password = ${?DB_PASSWORD}
}

firebase {
    # Путь к JSON сервис-аккаунта Firebase. Если пусто — работает dev-режим.
    serviceAccountPath = ""
    serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT}
    # В dev-режиме принимается токен вида "dev:<uid>" — удобно тестировать без Firebase
    devMode = true
    devMode = ${?AUTH_DEV_MODE}
}
